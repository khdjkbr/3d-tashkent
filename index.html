<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Лёгкая 3D-карта Ташкента" />
    <title>3D Ташкент</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css?v=31" />
  </head>
  <body>
    <main class="app-shell">
      <section id="map" aria-label="Интерактивная 3D-карта Ташкента"></section>


      <header class="topbar">
        <div>
          <p class="eyebrow">Городская география</p>
          <h1>3D Ташкент</h1>
        </div>
        <button id="reset-view" class="ghost-button" type="button">К Ташкенту</button>
      </header>


      <aside class="control-panel" aria-label="Слои карты">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Слои</p>
            <h2>Что показать</h2>
          </div>
          <span class="status-dot" title="Демо-режим"></span>
          <button id="toggle-panel" class="panel-toggle" type="button" aria-label="Свернуть панель" title="Свернуть или раскрыть панель">−</button>
        </div>
      <label class="layer-row"><span><i class="swatch buildings"></i>🏢 Здания</span><input data-layer="buildings" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch roads"></i>🛣️ Дороги</span><input data-layer="roads" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch water"></i>💧 Вода</span><input data-layer="water" type="checkbox" checked /></label>
      <label class="layer-row"><span><i class="swatch greenery"></i>⛰️ Рельеф</span><input data-layer="terrain" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch greenery"></i>🌿 Зелёные зоны</span><input data-layer="greenery" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch greenery"></i>🌳 Деревья</span><input data-layer="trees" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch crossings"></i>🚶 Переходы</span><input data-layer="crossings" type="checkbox" checked /></label>
<label class="layer-row"><span><i class="swatch crossings"></i>🌉 Мосты и надземные переходы</span><input data-layer="bridges" type="checkbox" checked /></label>
        <label class="layer-row"><span><i class="swatch underground"></i>↘️ Подземные переходы</span><input data-layer="underground" type="checkbox" checked /></label>
        <div class="legend-note">Основные слои — OSM. Специальные объекты загружаются для области карты через Overpass API.</div>
      </aside>


      <div class="map-hint">Перетаскивайте карту · колёсико — масштаб · Ctrl + перетаскивание — наклон</div>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script src="app.js?v=40"></script>
  </body>
</html>
